<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><meta name="description" content="依照預算、交通方式、距離與飲食偏好，幫你決定今天吃什麼。"><link rel="manifest" href="manifest.webmanifest"><link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet"><link rel="stylesheet" href="styles.css"><title>呷啥｜今天吃什麼</title></head><body>
<main class="app-shell"><header class="hero"><div class="brand-row"><span class="brand-icon">呷</span><span>呷啥</span></div><h1>今天要吃<br><em>什麼？</em></h1><p>選交通方式、距離和預算，直接找附近能吃的店。</p></header>
<section class="panel location-panel"><div class="location-copy"><span class="location-icon">📍</span><div><strong id="locationTitle">尚未取得位置</strong><small id="locationText">按下按鈕即可搜尋附近真實餐廳</small></div></div><button id="locationButton" class="location-button">取得定位</button></section>
<section class="panel filters-panel">
<div class="section-title">🍽️ 今天想吃</div><div id="categoryChips" class="chip-grid three"></div>
<div class="section-title top-gap">🧭 怎麼過去</div><div id="transportChips" class="chip-grid three"></div>
<div class="section-title top-gap">📏 最遠距離</div><div class="inline-control"><input id="distanceInput" type="number" min="0.3" max="20" step="0.5" value="2" inputmode="decimal"><span>公里</span></div><p class="helper">可輸入 0.3～20 公里；修改距離後會自動重新搜尋。</p>
<div class="section-title top-gap">👥 幾個人</div><div class="inline-control people-control"><input id="peopleInput" type="number" min="1" max="20" step="1" value="1" inputmode="numeric"><span>人</span></div><div class="section-title top-gap">💰 全部人的總預算</div><label class="check-card"><input id="unlimitedBudget" type="checkbox" checked><span><strong>無上限</strong><small>有真實菜單時，才會依人數與預算篩選</small></span></label><div class="budget-control"><span>$</span><input id="budgetInput" type="number" min="0" step="10" inputmode="numeric" placeholder="例如 500" disabled><span>元</span></div><p id="budgetSummary" class="helper">1 人 · 不限預算</p><div id="budgetSuggestion" class="budget-suggestion"></div>
<div class="section-title top-gap">🙅 今天不想吃</div><div id="exclusionChips" class="chip-grid two"></div>
<label class="switch-row"><span>只排除確定已休息的店</span><input id="openOnly" type="checkbox" checked></label><button id="chooseButton" class="primary-button">🎲 幫我決定</button><div id="resultCount" class="result-count">目前使用示範店家</div></section>
<section class="panel map-panel"><div class="map-header"><div><small>OpenFreeMap</small><h2>附近店家地圖</h2></div><button id="fitMapButton" class="map-fit-button" type="button">顯示全部</button></div><div id="map" class="map-canvas" aria-label="附近店家地圖"></div><p id="mapStatus" class="map-status">取得定位後，會在地圖上顯示附近店家。</p></section>
<div id="notice" class="notice hidden"></div><section id="resultCard" class="panel result-card hidden"></section>
<section class="nearby-section"><div class="nearby-header"><div><small>附近選項</small><h2>可以吃什麼</h2></div><span id="nearbyCount">0 間</span></div><div id="restaurantList" class="restaurant-list"></div></section>
<footer>地圖由 OpenFreeMap 提供；店家資料來自 OpenStreetMap。App 會嘗試搜尋公開菜單來源；推測品項不代表官方菜單。</footer></main><script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><script src="main.js" defer></script></body></html>
